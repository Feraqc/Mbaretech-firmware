[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
	Wire ; I2C del framework -- la usa src/tests/pruebaIMU.cpp
	;I2Cdev
	;MPU6050
	;WiFi
	;ESP Async WebServer
    ;me-no-dev/AsyncTCP @ ^1.1.1
	;nkolban/ESP32 BLE Arduino @ ^1.0.1
	;h2zero/NimBLE-Arduino

; uncomment the specific test flag for the feature you want to test
;build_flags = -DRUN_GYRO_TEST
;build_flags = -DRUN_SENSORS_TEST
;build_flags = -DRUN_LINE_SENSOR
;build_flags = -DRUN_WIFI_SENSORS_TEST
;build_flags = -DRUN_DRIVER_TEST
;build_flags = -DRUN_LS_SENSOR_TEST
;build_flags = -DRUN_TASK_TEST
;build_flags = -DRUN_MOVEMENT_SENSOR_CALIBRATION
;build_flags = -DRUN_CALIBRACION
;build_flags = -DFAST_ENEMY
;build_flags = -DCANCEL_TURNS

;build_flags = ;FIGHT
;	-DESTADOS_ORDEN
;	-DMBARETECH_2
;	-DRUN_LINE_SENSOR
;	-DRUN_TASK_TEST
;	-DFAST_ENEMY
;	-DCANCEL_TURNS
;	-DFORWARDON
;	-DDEBUG

build_flags = ;CALIBRACION -- lee IR + DIP + linea y los manda por BLE/Serial cada 300ms
	-DMBARETECH_2
	-DRUN_LINE_SENSOR
	-DRUN_CALIBRACION
	-DDEBUG
;	-DSKIP_BLE ; PRUEBA TEMPORAL: BLE apagado del todo para descartarlo como causa del giro intermitente en 0001. Ya se confirmo que NO era BLE -- dejar comentado.

;build_flags = ;BORRAR -- prueba minima del ESP32: "Hola mundo" por Serial cada 1s (src/borrar.cpp)
;	-DMBARETECH_2
;	-DRUN_BORRAR

;build_flags = ;BORRAR ATRAS ADELANTE -- un motor a la vez, en bucle: der adelante 300ms, der atras 300ms, izq adelante 300ms, izq atras 300ms, 1s frenado entre cada uno, PWM parametros[2] (src/tests/borrarAtrasAdelante.cpp), temporal
;	-DMBARETECH_2
;	-DRUN_BORRAR_ATRAS_ADELANTE
;	-DDEBUG

;build_flags = ;PRUEBA MOTORES -- avanza los 2 motores mientras el killswitch este activo (src/tests/pruebaMotores.cpp), sin sensores ni BLE
;	-DMBARETECH_2
;	-DRUN_PRUEBA_MOTORES
;	-DDEBUG

;build_flags = ;PRUEBA SWITCH -- lee los 5 DIP y muestra estado + combo, no mueve nada (src/tests/pruebaSwitch.cpp)
;	-DMBARETECH_2
;	-DRUN_PRUEBA_SWITCH

;build_flags = ;PRUEBA IMU -- escaneo I2C + MPU6050 por registros (src/tests/pruebaIMU.cpp), sin motores
;	-DMBARETECH_2
;	-DRUN_PRUEBA_IMU
;	-DDEBUG

;build_flags = ;PRUEBA MARTILLO -- empuja con killswitch y mide velocidad estimada (integracion de ay) en una ventana acotada, para calibrar el futuro modo martillo (src/tests/pruebaMartillo.cpp) -- EN PAUSA
;	-DMBARETECH_2
;	-DRUN_PRUEBA_MARTILLO
;	-DDEBUG

;build_flags = ;PRUEBA FRENADO -- avanza al 80%, al ver linea blanca hace la reversa de combate (90% x 80ms) y frena (src/tests/pruebaFrenadoLinea.cpp)
;	-DMBARETECH_2
;	-DRUN_LINE_SENSOR
;	-DRUN_PRUEBA_FRENADO
;	-DDEBUG

;build_flags = ;PRUEBA FRENADO ATRAS -- retrocede al 80%, al ver linea blanca con un sensor TRASERO empuja adelante 90% x 80ms y frena (src/tests/pruebaFrenadoLinea.cpp) -- VALIDADA 2026-10-01
;	-DMBARETECH_2
;	-DRUN_LINE_SENSOR
;	-DRUN_PRUEBA_FRENADO
;	-DFRENADO_ATRAS
;	-DDEBUG

;build_flags = ;GIRAR 45 LINEA -- avanza al 80%; linea IZQ -> reversa 80ms + giro 45 DER, linea DER -> reversa 80ms + giro 45 IZQ, AMBOS -> reversa + giro IZQ 120ms (~180, sin calibrar); y sigue (src/tests/Girar45Linea.cpp)
;	-DMBARETECH_2
;	-DRUN_LINE_SENSOR
;	-DRUN_GIRAR45_LINEA
;	-DDEBUG

;build_flags = ;AUTOCAL GIRO -- gira, mide el angulo con el IMU y corrige el tiempo de giro hasta 45 +-2 grados, IZQ y DER alternados, 1s de pausa (src/tests/autoCalGiro.cpp)
;	-DMBARETECH_2
;	-DRUN_AUTOCAL_GIRO
;	-DDEBUG

;build_flags = ;PRUEBA LINEA -- crudo/min/max/filtro de los 4 sensores de linea (src/tests/pruebaLinea.cpp), sin motores
;	-DMBARETECH_2
;	-DRUN_LINE_SENSOR
;	-DRUN_PRUEBA_LINEA
;	-DDEBUG

;build_flags = ;DRIVER TEST
;	-DMBARETECH_2
;	-DRUN_LINE_SENSOR
;	-DRUN_DRIVER_TEST
